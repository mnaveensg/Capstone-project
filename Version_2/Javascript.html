<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI LMS - Module 5: JavaScript Interactivity</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      background-color: #f5f7fa;
    }
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex: 0 0 calc(50% - 10px);
      max-width: calc(50% - 10px);
      box-sizing: border-box;
    }
    h2 {
      color: #1a73e8;
    }
    .highlight {
      color: green;
      font-weight: bold;
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
    }
    .email-form {
      display: flex;
      gap: 10px;
      align-items: stretch;
      margin-bottom: 5px;
    }
    .email-form input {
      flex: 1;
      width: auto;
      margin-right: 0;
    }
    .email-form button {
      width: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <h1>AI-Powered LMS: JavaScript Practice</h1>

  <div class="card-grid">
  <div class="section">
    <h2>1. Enroll in Course</h2>
    <button onclick="enroll()">Click to Enroll</button>
    <script>
      function enroll() {
        alert("You have been enrolled in the 'JavaScript Essentials' course!");
      }
    </script>
  </div>
  <div class="section">
    <h2>2. AI Suggestion Box</h2>
    <p id="suggestionText">Click the button below to get a course suggestion.</p>
    <button onclick="getSuggestion()">Get AI Suggestion</button>

    <script>
      function getSuggestion() {
        let text = document.getElementById("suggestionText");
        text.textContent = "We recommend: 'Responsive Web Design' next!";
        text.style.color = "#1a73e8";
      }
    </script>
  </div>
  <div class="section">
    <h2>3. Validate Learner Email</h2>
    <form class="email-form" onsubmit="validateEmail(); return false;">
      <input type="text" id="email" placeholder="Enter your email to receive updates">
      <button type="submit">Submit</button>
    </form>
    <p id="emailMessage" class="highlight"></p>

    <script>
      function validateEmail() {
        let emailInput = document.getElementById("email").value;
        let emailMessage = document.getElementById("emailMessage");
        if (!emailInput.includes("@")) {
          emailMessage.textContent = "Invalid email address";
          emailMessage.style.color = "red";
          return;
        }
        emailMessage.textContent = "Email accepted!";
        emailMessage.style.color = "green";
        setTimeout(function () {
          emailMessage.textContent = "";
          document.getElementById("email").value = "";
        }, 1000);
      }
    </script>
  </div>
  <div class="section">
    <h2>4. Type Your Learning Goal</h2>
    <input type="text" id="goalInput" placeholder="e.g., Master JavaScript...">
    <p id="goalOutput">Your goal: </p>

    <script>
      let goalInput = document.getElementById("goalInput");

      goalInput.addEventListener("input", function () {
        document.getElementById("goalOutput").textContent = "Your goal: " + goalInput.value;
      });
    </script>
  </div>

  </div>

</body>
</html>
